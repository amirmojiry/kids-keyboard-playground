<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#fff7ed" />
  <title>Kids Keyboard Playground</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app" id="app">
    <header class="toolbar" aria-label="تنظیمات">
      <div class="brand">⌨️ Kids Keyboard</div>

      <div class="controls">
        <div class="segmented" role="group" aria-label="زبان">
          <button type="button" class="seg active" data-language="fa">فارسی</button>
          <button type="button" class="seg" data-language="en">English</button>
        </div>

        <div class="segmented" role="group" aria-label="حالت">
          <button type="button" class="seg active" data-mode="letter">حرف</button>
          <button type="button" class="seg" data-mode="word">حرف + کلمه</button>
        </div>

        <button type="button" id="soundToggle" class="icon-button" aria-pressed="true" aria-label="صدا روشن است">🔊</button>
      </div>
    </header>

    <section class="stage" id="stage" tabindex="0" aria-live="polite">
      <div class="sparkles" aria-hidden="true">
        <span>✨</span><span>⭐</span><span>🌟</span><span>✨</span>
      </div>

      <p class="hint" id="hint">یک کلید روی کیبورد بزن!</p>
      <div class="letter" id="letter">آ</div>
      <div class="word" id="word"></div>
      <div class="key-label" id="keyLabel"></div>
    </section>

    <footer class="footer-note">
      <span>برای پنهان/نمایان کردن تنظیمات: Esc را ۳ بار بزن</span>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
